[workspace]
resolver = "2"
members = [
    "crates/mythterm-core",
    "crates/mythterm-config",
    "crates/mythterm-font",
    "crates/mythterm-mux",
    "crates/mythterm-render",
    "crates/mythterm-ui",
    "crates/wgsl-sdf",
    "crates/tab-test",
    "crates/sdf-test",
    "crates/scene-chrome-test",
    "crates/display-test",
    "crates/retained-scene-test",
    "mythterm-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmacedoeu/mythterm"

[workspace.dependencies]
# Internal crates
mythterm-core   = { path = "crates/mythterm-core" }
mythterm-config = { path = "crates/mythterm-config" }
mythterm-font   = { path = "crates/mythterm-font" }
mythterm-mux    = { path = "crates/mythterm-mux" }
mythterm-render = { path = "crates/mythterm-render" }
mythterm-ui     = { path = "crates/mythterm-ui" }
wgsl-sdf        = { path = "crates/wgsl-sdf" }

# Myth engine (git dependency, pinned to 0.2.0 stable release)
myth_core      = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }
myth_render    = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }
myth_scene     = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }
myth_app       = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }
myth_assets    = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }
myth_resources = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }
myth_macros    = { git = "https://github.com/panxinmiao/myth.git", tag = "0.2.0" }

# Graphics and GPU
wgpu = { version = "29.0.3", features = ["wgsl"] }
glam = { version = "0.32.1", features = ["bytemuck", "scalar-math"] }
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
guillotiere = "0.6"

# Windowing and Input
winit = { version = "0.30.13" }
raw-window-handle = "0.6"

# egui
egui = "0.34.2"
egui-wgpu = "0.34.2"
egui-winit = { version = "0.34.2", default-features = false }

# WezTerm terminal core (pinned to 577474d)
wezterm-term    = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["use_serde"] }
wezterm-cell    = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["std", "use_serde", "use_image"] }
wezterm-surface = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["std", "appdata", "use_serde", "use_image"] }
termwiz         = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["use_serde", "use_image"] }
wezterm-escape-parser = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["std"] }
wezterm-dynamic = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["std"] }
wezterm-dynamic-derive = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
wezterm-color-types = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["std", "use_serde"] }
wezterm-char-props = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
wezterm-input-types = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
wezterm-bidi    = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
wezterm-blob-leases = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
vtparse         = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
portable-pty    = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d", features = ["serde_support"] }
strip-ansi-escapes = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
wezterm-toast-notification = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }
wezterm-open-url = { git = "https://github.com/wezterm/wezterm.git", rev = "577474d" }

# Font
ab_glyph = "0.2"
fontconfig = "0.7"

# Text shaping
rustybuzz = "0.20"
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs-next = "2.0"
notify = "6.0"

# Utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
parking_lot = "0.12"
flume = "0.12"
arc-swap = "1.7"
pollster = "0.4"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "term"] }
async-trait = "0.1"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
