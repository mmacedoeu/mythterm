[workspace]
resolver = "2"
members = [
    "crates/mythterm-core",
    "crates/mythterm-config",
    "crates/mythterm-font",
    "crates/mythterm-mux",
    "crates/mythterm-render",
    "crates/mythterm-ui",
    "mythterm-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmacedoeu/mythterm"

[workspace.dependencies]
# Internal crates
mythterm-core   = { path = "crates/mythterm-core" }
mythterm-config = { path = "crates/mythterm-config" }
mythterm-font   = { path = "crates/mythterm-font" }
mythterm-mux    = { path = "crates/mythterm-mux" }
mythterm-render = { path = "crates/mythterm-render" }
mythterm-ui     = { path = "crates/mythterm-ui" }

# Myth engine (path dependency)
myth-core      = { path = "../frontend/myth/crates/myth_core" }
myth-render    = { path = "../frontend/myth/crates/myth_render" }
myth-scene     = { path = "../frontend/myth/crates/myth_scene" }
myth-app       = { path = "../frontend/myth/crates/myth_app" }
myth-assets    = { path = "../frontend/myth/crates/myth_assets" }
myth-resources = { path = "../frontend/myth/crates/myth_resources" }
myth-macros    = { path = "../frontend/myth/crates/myth_macros" }

# Graphics and GPU
wgpu = { version = "29.0.3", features = ["wgsl"] }
glam = { version = "0.32.1", features = ["bytemuck", "scalar-math"] }
bytemuck = { version = "1.25", features = ["derive"] }

# Windowing and Input
winit = { version = "0.30.13" }
raw-window-handle = "0.6"

# egui
egui = "0.34.2"
egui-wgpu = "0.34.2"
egui-winit = { version = "0.34.2", default-features = false }

# Terminal / PTY
portable-pty = "0.8"
vtparse = "0.2"
termwiz = "0.24"

# Font
ab_glyph = "0.2"
fontdue = "0.9"
fontconfig = "0.7"

# Text shaping
rustybuzz = "0.20"
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs-next = "2.0"
notify = "6.0"

# Utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
parking_lot = "0.12"
flume = "0.12"
arc-swap = "1.7"
pollster = "0.4"

# Platform
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "term"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
