[package]
name = "mythterm"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "GPU-accelerated terminal emulator powered by Myth and egui"

[[bin]]
name = "mythterm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap = { version = "4.0", features = ["derive"] }
myth-app.workspace = true
mythterm-core.workspace = true
mythterm-config.workspace = true
mythterm-font.workspace = true
mythterm-mux.workspace = true
mythterm-render.workspace = true
mythterm-ui.workspace = true
