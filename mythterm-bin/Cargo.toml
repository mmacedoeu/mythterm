[package]
name = "mythterm"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "GPU-accelerated terminal emulator powered by Myth and egui"

[[bin]]
name = "mythterm"
path = "src/main.rs"

[dependencies]
# mythterm crates
mythterm-core.workspace = true
mythterm-config.workspace = true
mythterm-font.workspace = true
mythterm-mux.workspace = true
mythterm-render.workspace = true
mythterm-ui.workspace = true

# Myth engine
myth_app.workspace = true

# egui + winit
egui.workspace = true
egui-winit.workspace = true
winit.workspace = true
wgpu.workspace = true

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
pollster.workspace = true

[dev-dependencies]
