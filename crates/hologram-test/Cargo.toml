[package]
name = "hologram-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hologram-test"
path = "src/main.rs"

[dependencies]
wgpu        = { version = "29", features = ["wgsl"] }
winit       = "0.30"
bytemuck    = { version = "1", features = ["derive"] }
env_logger  = "0.11"
log         = "0.4"
pollster    = "0.4"
wgsl-sdf    = { path = "../wgsl-sdf" }
